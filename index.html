    const BRITISH_CONVERSIONS = [

      { us: 'movie', uk: 'film', note: 'É muito comum dizer "watch a film" ou ir ao "cinema".' },

    // Motor de resposta britânica offline/autónoma (garante conversação sem depender de API key)
    function generateAutonomousBritishResponse(userInput, topic, level) {
      const lower = userInput.toLowerCase();
      let hasErrors = false;
      let correction = "Splendid! Frase muito bem estruturada.";
      let improvedSentence = "";
      let phoneticTip = "Dica Britânica: Pronuncie as consoantes de forma clara e evite o 'r' enrolado no final das palavras.";
      let score = 9;

      // 1. Deteção de Americanismos
      for (const item of BRITISH_CONVERSIONS) {
        const regex = new RegExp(`\\b${item.us}\\b`, 'i');
        if (regex.test(userInput)) {
          hasErrors = true;
          correction = `Nota de vocabulário britânico: ${item.note}`;
          improvedSentence = userInput.replace(regex, item.uk);
          phoneticTip = `🇬🇧 vs 🇺🇸: Prefira sempre "${item.uk}" quando estiver no Reino Unido!`;
          score = 7;
          break;
        }
      }

      // 2. Deteção de pequenos erros gramaticais comuns
      if (!hasErrors) {
        if (/\bi am agree\b/i.test(userInput)) {
          hasErrors = true;
          correction = "Em inglês diz-se 'I agree' (verbo) e não 'I am agree'.";
          improvedSentence = userInput.replace(/i am agree/i, "I agree");
          score = 7;
        } else if (/\bhe have\b/i.test(userInput)) {
          hasErrors = true;
          correction = "Para a 3ª pessoa 'he', deve usar-se 'he has'.";
          improvedSentence = userInput.replace(/he have/i, "he has");
          score = 7;
        } else if (/\bi have (\d+) years\b/i.test(userInput)) {
          hasErrors = true;
          correction = "Para idade diz-se 'I am ... years old', não 'I have'.";
          improvedSentence = userInput.replace(/i have (\d+) years/i, "I am $1 years old");
          score = 7;
        } else if (userInput.trim().length < 5) {
          correction = "Boa resposta! Tente desenvolver um pouco mais a frase para enriquecer a conversação.";
          score = 8;
        }
      }

      // 3. Respostas contextuais por tema com tom e vocabulário britânico
      let reply = "";
      let question = "";
      let suggestedReplies = [];

      const tid = (topic?.id || '').toLowerCase();

      if (tid.includes('pub') || lower.includes('beer') || lower.includes('pint') || lower.includes('drink') || lower.includes('roast')) {
        reply = "Splendid choice! A proper pint of bitter or a refreshing cider goes down a treat in a cosy British pub, especially alongside a generous Sunday roast with Yorkshire pudding.";
        question = "Tell me, do you fancy trying traditional fish and chips, or would you prefer a hearty shepherd's pie for lunch?";
        suggestedReplies = [
          "I'd love some proper fish and chips, cheers!",
          "A shepherd's pie sounds absolutely delicious.",
          "Just a pint of cider and some crisps for me, thanks."
        ];
        phoneticTip = "No pub britânico diz-se 'Cheers, mate!' para agradecer ao barman quando serve a bebida.";
      } else if (tid.includes('weather') || lower.includes('rain') || lower.includes('sun') || lower.includes('cold') || lower.includes('drizzle')) {
        reply = "Quite right! You can always count on British weather to keep us guessing. One minute it's brisk sunshine, and the next we're dealing with proper drizzle.";

    function App() {

      const [transcript, setTranscript] = useState('');
      const [inputText, setInputText] = useState('');
      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const [currentlySpeakingId, setCurrentlySpeakingId] = useState(null);
      const [autoPlayAudio, setAutoPlayAudio] = useState(true);
      const [handsFreeCallMode, setHandsFreeCallMode] = useState(false);
      const [speechRate, setSpeechRate] = useState(1.0);
      const [selectedVoice, setSelectedVoice] = useState(null);
      const [availableVoices, setAvailableVoices] = useState([]);

      // Modals and UI navigation
      const [apiKey, setApiKey] = useState('');

      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showTopicModal, setShowTopicModal] = useState(false);
      const [showSpeechError, setShowSpeechError] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [translationMap, setTranslationMap] = useState({});
      const [activeCategoryTab, setActiveCategoryTab] = useState(TOPIC_CATEGORIES[0].id);

      // DOM refs
      const chatEndRef = useRef(null);
      const inputRef = useRef(null);
      const recognitionRef = useRef(null);
      const synthRef = useRef(window.speechSynthesis);

      // Initialize British Speech Synthesis voices
      useEffect(() => {
        const loadVoices = () => {
          if (!synthRef.current) return;
          const voices = synthRef.current.getVoices();
          setAvailableVoices(voices);

          // Find the best British voice
          const bestGbVoice = voices.find(v => 
            (v.lang === 'en-GB' || v.lang === 'en_GB') && 
            (v.name.includes('Natural') || v.name.includes('George') || v.name.includes('Hazel') || v.name.includes('Oliver') || v.name.includes('UK English'))
          ) || voices.find(v => v.lang === 'en-GB' || v.lang === 'en_GB') 
            || voices.find(v => v.lang.startsWith('en'));

          setSelectedVoice(bestGbVoice || voices[0] || null);
        };

        loadVoices();
        if (synthRef.current) {
          synthRef.current.onvoiceschanged = loadVoices;
        }
      }, []);

      // Initialize Web Speech Recognition
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          const recognition = new SpeechRecognition();
          recognition.continuous = false;
          recognition.interimResults = true;
          recognition.lang = 'en-GB';

          recognition.onstart = () => {
            setIsListening(true);
          };

          recognition.onresult = (event) => {
            let currentStr = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              currentStr += event.results[i][0].transcript;
            }
            setTranscript(currentStr);
            setInputText(currentStr);
          };

          recognition.onerror = (event) => {
            console.warn('Speech recognition warning/error:', event.error);
            setIsListening(false);
          };

          recognition.onend = () => {
            setIsListening(false);
            // If in hands-free mode and the user spoke something substantial, send automatically!
            if (handsFreeCallMode && inputRef.current && inputRef.current.value.trim().length > 2) {
              handleSendMessage(inputRef.current.value.trim());
            }
          };

          recognitionRef.current = recognition;
        }
      }, [handsFreeCallMode]);

      // Keep chat scrolled automatically
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isLoading, transcript]);

      // Start fresh topic session
      const startNewConversation = (topic = currentTopic, level = difficultyLevel) => {
        if (synthRef.current) synthRef.current.cancel();

        const welcomeStarter = topic.starterPrompt || 
          `Right then! Delighted to meet you. We are going to chat about "${topic.title}". How is your day going so far?`;

        const welcomeMessage = {
          id: Date.now().toString(),
          sender: 'tutor',
          content: {
            correction: 'Sessão iniciada! Fale ou escreva naturalmente em Inglês. Darei sugestões de pronúncia, gramática e termos britânicos.',
            hasErrors: false,
            improvedSentence: '',
            reply: welcomeStarter,
            question: 'Shall we get started? How are you feeling today?',
            phoneticTip: 'Dica Britânica: O "r" no final de palavras como "water", "car" ou "butter" é suave e não é enrolado.',
            britishVsAmerican: 'No Reino Unido diz-se "Cheers / Thanks" em vez de apenas "Thank you".',

        if (autoPlayAudio) {
          speakText(`${welcomeMessage.content.reply} ${welcomeMessage.content.question}`, welcomeMessage.id);

      useEffect(() => {
        startNewConversation();
      }, []);

      // British Voice synthesis trigger
      const speakText = (text, messageId = null) => {
        if (!synthRef.current) return;
        synthRef.current.cancel();

        if (currentlySpeakingId === messageId && isPlayingAudio) {
          setIsPlayingAudio(false);
          setCurrentlySpeakingId(null);
          return;
        }

        const cleanText = text.replace(/\[.*?\]/g, '').replace(/[\*\_]/g, '').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.rate = speechRate;
        utterance.lang = 'en-GB';

        if (selectedVoice) {
          utterance.voice = selectedVoice;
        }

        utterance.onstart = () => {
          setIsPlayingAudio(true);
          if (messageId) setCurrentlySpeakingId(messageId);
        };

        utterance.onend = () => {
          setIsPlayingAudio(false);
          setCurrentlySpeakingId(null);

          // If Hands-Free Call Mode is active, automatically activate user's microphone when tutor finishes!
          if (handsFreeCallMode && recognitionRef.current) {
            setTimeout(() => {
              try {
                recognitionRef.current.start();
              } catch (e) {
                // already active or permission needed
              }
            }, 500);
          }
        };

        utterance.onerror = () => {
          setIsPlayingAudio(false);
          setCurrentlySpeakingId(null);
        };

        synthRef.current.speak(utterance);
      };

      const toggleListening = () => {
        if (!recognitionRef.current) {
          setShowSpeechError(true);
          return;
        }

        if (isListening) {
          recognitionRef.current.stop();
          setIsListening(false);
        } else {
          if (synthRef.current) synthRef.current.cancel();
          setTranscript('');
          setInputText('');
          try {
            recognitionRef.current.start();
          } catch (err) {
            console.error('Failed to start recognition:', err);
          }
        }
      };

      const handleSendMessage = async (overrideText = null) => {
        const textToSend = (overrideText || inputText).trim();
        if (!textToSend || isLoading) return;

        if (isListening && recognitionRef.current) {
          recognitionRef.current.stop();
        }

        const userMessage = {
          id: Date.now().toString(),
          sender: 'user',
          text: textToSend,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        const updatedMessages = [...messages, userMessage];
        setMessages(updatedMessages);
        setInputText('');
        setTranscript('');
        setIsLoading(true);

        try {
          const historyContext = [];
          const firstUserIdx = updatedMessages.findIndex((m) => m.sender === 'user');

          if (firstUserIdx !== -1) {
            for (let i = firstUserIdx; i < updatedMessages.length; i++) {
              const msg = updatedMessages[i];
              const role = msg.sender === 'user' ? 'user' : 'model';
              let textContent = '';

              if (msg.sender === 'user') {
                textContent = (msg.text || '').trim();
              } else if (msg.content && msg.content.reply) {
                // Descartar do contexto mensagens de erro transitórias anteriores
                if (
                  msg.content.reply.includes('hiccup') ||
                  msg.content.reply.includes('bother processing') ||
                  msg.content.reply.includes('apologise')
                ) {
                  continue;
                }
                textContent = `${msg.content.reply} ${msg.content.question || ''}`.trim();
              }

              if (!textContent) continue;

              // Garantir alternância estrita entre 'user' e 'model'
              if (historyContext.length > 0 && historyContext[historyContext.length - 1].role === role) {
                historyContext[historyContext.length - 1].parts[0].text += `\n${textContent}`;
              } else {
                historyContext.push({ role, parts: [{ text: textContent }] });
              }
            }
          }

          const userMessage = {
            id: Date.now().toString(),
            sender: 'user',
            text: textToSend,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };

          const updatedMessages = [...messages, userMessage];
          setMessages(updatedMessages);
          setInputText('');
          setTranscript('');
          setIsLoading(true);

          let parsedData = null;

          // Se o utilizador configurou chave ou se estamos no ambiente compatível, tenta a API
          try {
            const historyContext = [];
            const firstUserIdx = updatedMessages.findIndex((m) => m.sender === 'user');

            if (firstUserIdx !== -1) {
              for (let i = firstUserIdx; i < updatedMessages.length; i++) {
                const msg = updatedMessages[i];
                const role = msg.sender === 'user' ? 'user' : 'model';
                let textContent = '';

                if (msg.sender === 'user') {
                  textContent = (msg.text || '').trim();
                } else if (msg.content && msg.content.reply) {
                  if (
                    msg.content.reply.includes('hiccup') ||
                    msg.content.reply.includes('apologise')
                  ) {
                    continue;
                  }
                  textContent = `${msg.content.reply} ${msg.content.question || ''}`.trim();
                }

                if (!textContent) continue;

                if (historyContext.length > 0 && historyContext[historyContext.length - 1].role === role) {
                  historyContext[historyContext.length - 1].parts[0].text += `\n${textContent}`;
                } else {
                  historyContext.push({ role, parts: [{ text: textContent }] });
                }
              }
            }

            if (historyContext.length === 0 || historyContext[0].role !== 'user') {
              historyContext.length = 0;
              historyContext.push({ role: 'user', parts: [{ text: textToSend }] });
            }

            const systemPrompt = `
You are a polite, encouraging British English Tutor speaking strictly in British English.
Topic: "${currentTopic.title}"
Level: ${difficultyLevel}/5 (${DIFFICULTY_LEVELS[difficultyLevel - 1].name}).
Respond strictly in JSON matching the schema.
`;

            const payload = {
              contents: historyContext,
              systemInstruction: { parts: [{ text: systemPrompt }] },
              generationConfig: {
                responseMimeType: 'application/json',
                responseSchema: {
                  type: 'OBJECT',
                  properties: {
                    correction: { type: 'STRING' },
                    hasErrors: { type: 'BOOLEAN' },
                    improvedSentence: { type: 'STRING' },
                    reply: { type: 'STRING' },
                    question: { type: 'STRING' },
                    phoneticTip: { type: 'STRING' },
                    performanceScore: { type: 'INTEGER' }
                  },
                  required: ['correction', 'hasErrors', 'improvedSentence', 'reply', 'question', 'phoneticTip', 'performanceScore']
                }
              }
            };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (response.ok) {
              const result = await response.json();
              let rawJsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;
              if (rawJsonText) {
                rawJsonText = rawJsonText.trim();
                if (rawJsonText.startsWith('```json')) {
                  rawJsonText = rawJsonText.replace(/^```json\s*/, '').replace(/\s*```$/, '');
                } else if (rawJsonText.startsWith('```')) {
                  rawJsonText = rawJsonText.replace(/^```\s*/, '').replace(/\s*```$/, '');
                }
                parsedData = JSON.parse(rawJsonText);
              }
            }
          } catch (netErr) {
            // Se falhar o pedido online, o motor autónomo assume de imediato
            console.log('Utilizando modo autónomo local britânico.');
          }

          // Se a API não respondeu ou não há chave, o motor autónomo local responde com excelência
          if (!parsedData) {
            // Pequeno delay natural de 400ms para simular a reflexão do tutor
            await new Promise(resolve => setTimeout(resolve, 400));
            parsedData = generateAutonomousBritishResponse(textToSend, currentTopic, difficultyLevel);
          }

          const tutorMessage = {
            id: (Date.now() + 1).toString(),
            sender: 'tutor',
            content: {
              correction: parsedData.correction || 'Spot on!',
              hasErrors: Boolean(parsedData.hasErrors),
              improvedSentence: parsedData.improvedSentence || '',
              reply: parsedData.reply || "Right then! Let's carry on.",
              question: parsedData.question || "What are your thoughts on this?",
              phoneticTip: parsedData.phoneticTip || "Tip: British English uses a softer final 'r'.",
              suggestedReplies: parsedData.suggestedReplies || [
                "Splendid! Let's talk more about that.",
                "Could you give me an example of how a Londoner would say it?",
                "That sounds brilliant, tell me more!"
              ],
              performanceScore: typeof parsedData.performanceScore === 'number' ? parsedData.performanceScore : 8
            },
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };

          setMessages((prev) => [...prev, tutorMessage]);

          if (!parsedData.hasErrors || parsedData.performanceScore >= 7) {
            setSuccessfulTurns((prevTurns) => {
              const nextTurns = prevTurns + 1;
              if (nextTurns >= 3 && difficultyLevel < 5) {
                setDifficultyLevel((prevLvl) => prevLvl + 1);
                setLevelUpNotification(true);
                setTimeout(() => setLevelUpNotification(false), 5000);
                return 0;
              }
              return nextTurns;
            });
          } else {
            setSuccessfulTurns(0);
          }

          if (autoPlayAudio) {
            speakText(`${parsedData.reply} ${parsedData.question}`, tutorMessage.id);
          }

        } catch (error) {
          console.error('Unhandled message error:', error);
        } finally {
          setIsLoading(false);
        }
      };

      const translateMessage = async (msgId, text) => {
        if (translationMap[msgId]) {
          setTranslationMap(prev => {
            const copy = { ...prev };
            delete copy[msgId];
            return copy;
          });
          return;
        }

        try {
          const payload = {
            contents: [
              {
                role: 'user',
                parts: [{ text: `Translate this British English dialogue to natural European Portuguese (Português de Portugal): "${text}"` }]
              }
            ]
          };

          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          const trText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Tradução indisponível.';
          setTranslationMap(prev => ({ ...prev, [msgId]: trText }));
        } catch (e) {
          console.error('Translation error:', e);
        }

      // Custom topic creator
      const handleCreateCustomTopic = () => {

          id: 'custom-' + Date.now(),

        };

        startNewConversation(newTop);

        return [...messages].reverse().find(m => m.sender === 'tutor');

                <div className={`w-full h-full ${currentTheme.bg} rounded-[10px] flex items-center justify-center`}>
                  <span className="text-xl">🇬🇧</span>
                </div>
              </div>
              <div className="leading-tight">
                <div className="flex items-center space-x-1.5">

                      startNewConversation(currentTopic, newL);
                    }}
                    className={`w-full ${currentTheme.inputBg} border rounded-xl px-3 py-2 text-xs sm:text-sm focus:outline-none focus:border-indigo-500`}
                  >
                    {DIFFICULTY_LEVELS.map((d) => (
                      <option key={d.level} value={d.level}>
                        Nível {d.level}: {d.name}
                      </option>
                    ))}
                  </select>
                  <p className="text-[11px] text-slate-400">
                    O tutor adapta o vocabulário, velocidade e gírias ao nível escolhido.
                  </p>
                </div>

                {/* Speech rate slider */}
                <div className="space-y-1.5">
                  <div className="flex justify-between text-xs font-semibold text-slate-300">
                    <span>Velocidade da Voz Britânica:</span>
                    <span className="text-indigo-400 font-mono">{speechRate}x</span>
                  </div>
                  <input
                    type="range"
                    min="0.75"
                    max="1.25"
                    step="0.05"
                    value={speechRate}
                    onChange={(e) => setSpeechRate(Number(e.target.value))}
                    className="w-full accent-indigo-500 cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] text-slate-500">
                    <span>Pausado (0.75x)</span>
                    <span>Natural (1.0x)</span>
                    <span>Nativo Rápido (1.25x)</span>
                  </div>
                </div>

                {/* System Voices selector */}
                <div className="space-y-1.5">
                  <label className="text-xs font-semibold block text-slate-300">
                    Voz do Sistema (en-GB):
                  </label>
                  <select
                    value={selectedVoice?.name || ''}
                    onChange={(e) => {
                      const v = availableVoices.find(voice => voice.name === e.target.value);
                      if (v) setSelectedVoice(v);
                    }}
                    className={`w-full ${currentTheme.inputBg} border rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500`}
                  >
                    {availableVoices.map((v) => (
                      <option key={v.name} value={v.name}>
                        {v.name} ({v.lang})
                      </option>
                    ))}
                  </select>
                </div>

                {/* API Key Input */}
                <div className="space-y-1.5 pt-2 border-t border-slate-800">
                  <label className="text-xs font-semibold block text-slate-300">
                    Chave API Gemini (Opcional):
                  </label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    placeholder="Deixe em branco para usar a chave padrão"
                    className={`w-full ${currentTheme.inputBg} border rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500`}
                  />
                  <p className="text-[10px] text-slate-500">
                    No ambiente padrão, a chave é fornecida automaticamente em tempo de execução.
                  </p>
                </div>

                <button
                  onClick={() => setShowSettingsModal(false)}
                  className={`w-full ${currentTheme.accentBtn} text-white font-bold py-2.5 rounded-xl transition text-xs sm:text-sm shadow-md`}
                >
                  Concluir e Guardar
                </button>
              </div>
            </div>
          )}

          {/* THEME SELECTION MODAL */}
          {showThemeModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50">
              <div className={`${currentTheme.modalBg} border rounded-3xl max-w-sm w-full p-5 sm:p-6 shadow-2xl space-y-4`}>
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center space-x-2">
                    <Icons.Palette className="w-5 h-5 text-indigo-400" />
                    <h3 className="font-bold text-base sm:text-lg">Temas Visuais</h3>
                  </div>
                  <button
                    onClick={() => setShowThemeModal(false)}
                    className="p-1 rounded-lg opacity-70 hover:opacity-100"
                  >
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-2">
                  {THEMES.map((th) => (
                    <button
                      key={th.id}
                      onClick={() => {
                        setCurrentTheme(th);
                        setShowThemeModal(false);
                      }}
                      className={`w-full p-3 rounded-2xl border text-left flex items-center justify-between transition active:scale-95 ${
                        currentTheme.id === th.id
                          ? 'border-indigo-500 bg-indigo-950/40 ring-1 ring-indigo-500'
                          : `${th.innerCard} hover:border-indigo-400/50`
                      }`}
                    >
                      <div className="flex items-center space-x-3">
                        <span className="text-2xl">{th.icon}</span>
                        <span className="font-semibold text-sm">{th.name}</span>
                      </div>
                      {currentTheme.id === th.id && (
                        <Icons.CheckCircle2 className="w-5 h-5 text-indigo-400" />
                      )}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* SPEECH NOT SUPPORTED MODAL */}
          {showSpeechError && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className={`${currentTheme.modalBg} border rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-3`}>
                <div className="flex items-center space-x-2 text-amber-400 font-bold">
                  <Icons.AlertCircle className="w-5 h-5" />
                  <span>Microfone / Reconhecimento de Voz</span>
                </div>
                <p className="text-xs text-slate-300 leading-relaxed">
                  O reconhecimento de voz nativo funciona idealmente no Google Chrome, Safari recente ou Edge. Certifique-se de autorizar a permissão do microfone nas opções do navegador. Pode continuar a conversar digitando no teclado normalmente.
                </p>
                <button
                  onClick={() => setShowSpeechError(false)}
                  className={`w-full ${currentTheme.accentBtn} text-white py-2 rounded-xl text-xs font-semibold`}
                >
                  Entendido
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
