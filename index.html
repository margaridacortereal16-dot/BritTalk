    function App() {
      // Conversation state
      const [messages, setMessages] = useState([]);
      const [currentTopic, setCurrentTopic] = useState(PRESET_TOPICS[0]);
      const [customTopic, setCustomTopic] = useState('');
      const [difficultyLevel, setDifficultyLevel] = useState(1);
      const [successfulTurns, setSuccessfulTurns] = useState(0);
      const [levelUpNotification, setLevelUpNotification] = useState(false);

      // Speech Recognition & Synthesis states
      const [isListening, setIsListening] = useState(false);
      const [transcript, setTranscript] = useState('');
      const [inputText, setInputText] = useState('');
      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const [currentlySpeakingId, setCurrentlySpeakingId] = useState(null);
      const [autoPlayAudio, setAutoPlayAudio] = useState(true);
      const [speechRate, setSpeechRate] = useState(0.95);
      const [selectedVoice, setSelectedVoice] = useState(null);
      const [availableVoices, setAvailableVoices] = useState([]);

      // UI & Gemini API state
      const [apiKey, setApiKey] = useState('');
      const [currentTheme, setCurrentTheme] = useState(THEMES[0]);
      const [showThemeModal, setShowThemeModal] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showTopicModal, setShowTopicModal] = useState(false);
      const [showHelpModal, setShowHelpModal] = useState(false);
      const [speechErrorModal, setSpeechErrorModal] = useState(false);
      const [hintMessage, setHintMessage] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [translationMap, setTranslationMap] = useState({});

      // Refs
      const chatEndRef = useRef(null);
      const recognitionRef = useRef(null);
      const synthRef = useRef(window.speechSynthesis);

      // Initialize available voices
      useEffect(() => {
        const updateVoices = () => {
          if (!synthRef.current) return;
          const voices = synthRef.current.getVoices();
          setAvailableVoices(voices);

          const gbVoice = voices.find(
            (v) => v.lang === 'en-GB' || v.lang === 'en_GB' || v.name.includes('UK') || v.name.includes('British')
          );
          const fallbackEnglish = voices.find((v) => v.lang.startsWith('en'));
          setSelectedVoice(gbVoice || fallbackEnglish || voices[0] || null);
        };

        updateVoices();
        if (synthRef.current) {
          synthRef.current.onvoiceschanged = updateVoices;
        }
      }, []);

      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          const recognition = new SpeechRecognition();
          recognition.continuous = false;
          recognition.interimResults = true;
          recognition.lang = 'en-GB';

          recognition.onstart = () => {
            setIsListening(true);
          };

          recognition.onresult = (event) => {
            let currentTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              currentTranscript += event.results[i][0].transcript;
            }
            setTranscript(currentTranscript);
            setInputText(currentTranscript);
          };

          recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            setIsListening(false);
          };

          recognition.onend = () => {
            setIsListening(false);
          };

          recognitionRef.current = recognition;
        }
      }, []);

      // Auto-scroll chat to bottom
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isLoading, transcript]);

      // Start or reset conversation with starter prompt
      const startNewConversation = (topic = currentTopic, level = difficultyLevel) => {
        const initialText = topic.starterPrompt || `Hello! I'm delighted to chat with you today about ${topic.title}. What would you like to discuss first?`;
        
        const firstMessage = {
          id: Date.now().toString(),
          sender: 'tutor',
          content: {
            correction: 'Welcome to your British English practice session! I am ready to converse with you.',
            hasErrors: false,
            improvedSentence: '',
            reply: initialText,
            question: 'Ready when you are! How are you feeling today?',
            phoneticTip: 'Tip: Pronounce "schedule" as "shed-yool" in British English.',
            performanceScore: 10
          },
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setMessages([firstMessage]);
        setSuccessfulTurns(0);

        if (autoPlayAudio) {
          speakText(`${firstMessage.content.reply} ${firstMessage.content.question}`, firstMessage.id);
        }
      };

      useEffect(() => {
        startNewConversation();
      }, []);

      const speakText = (text, messageId = null) => {
        if (!synthRef.current) return;

        synthRef.current.cancel();

        if (currentlySpeakingId === messageId && isPlayingAudio) {
          setIsPlayingAudio(false);
          setCurrentlySpeakingId(null);
          return;
        }

        const cleanText = text.replace(/\[.*?\]/g, '').trim();

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.rate = speechRate;
        utterance.lang = 'en-GB';

        if (selectedVoice) {
          utterance.voice = selectedVoice;
        }

        utterance.onstart = () => {
          setIsPlayingAudio(true);
          if (messageId) setCurrentlySpeakingId(messageId);
        };

        utterance.onend = () => {
          setIsPlayingAudio(false);
          setCurrentlySpeakingId(null);
        };

        utterance.onerror = () => {
          setIsPlayingAudio(false);
          setCurrentlySpeakingId(null);
        };

        synthRef.current.speak(utterance);
      };

      const toggleListening = () => {
        if (!recognitionRef.current) {
          setSpeechErrorModal(true);
          return;
        }

        if (isListening) {
          recognitionRef.current.stop();
          setIsListening(false);
        } else {
          if (synthRef.current) synthRef.current.cancel();
          setTranscript('');
          setInputText('');
          try {
            recognitionRef.current.start();
          } catch (err) {
            console.error('Failed to start recognition:', err);
          }
        }
      };

      const handleSendMessage = async (overrideText = null) => {
        const textToSend = (overrideText || inputText).trim();
        if (!textToSend || isLoading) return;

        if (isListening && recognitionRef.current) {
          recognitionRef.current.stop();
        }

        const userMessage = {
          id: Date.now().toString(),
          sender: 'user',
          text: textToSend,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        const updatedMessages = [...messages, userMessage];
        setMessages(updatedMessages);
        setInputText('');
        setTranscript('');
        setIsLoading(true);

        try {
          const historyContext = updatedMessages.map((msg) => {
            if (msg.sender === 'user') {
              return { role: 'user', parts: [{ text: msg.text }] };
            } else {
              return {
                role: 'model',
                parts: [{ text: `${msg.content.reply} ${msg.content.question}` }]
              };
            }
          });

          const systemPrompt = `
You are a highly articulate, polite, and encouraging British English Tutor speaking strictly in British English (spelling, vocabulary, idioms, tone).
Topic: "${currentTopic.title}"
Current User Difficulty Level: Level ${difficultyLevel} out of 5 (${DIFFICULTY_LEVELS[difficultyLevel - 1].name}).

Guidelines for Level ${difficultyLevel}:
- Level 1: Use clear, simple British vocabulary, shorter sentences, easy questions.
- Level 3: Use natural conversational speed, common idioms, moderate grammar depth.
- Level 5: Use advanced native British vocabulary (e.g. "spot on", "chuffed", "proper", "splendid"), complex grammar, nuanced questions.

MUST respond strictly in JSON format matching this schema:
{
  "correction": "Se o utilizador tiver erros de gramática, ortografia ou vocabulário, explica aqui de forma clara e encorajadora em Português ou Inglês simples. Se não houver erros, dá um elogio curto e genuíno em Português ou Inglês.",
  "hasErrors": true/false,
  "improvedSentence": "Reescrita perfeita da frase do utilizador em Inglês Britânico natural e elegante (ou string vazia se já estava perfeita)",
  "reply": "Sua resposta direta em Inglês Britânico ao conteúdo falado pelo utilizador, mantendo o tom britânico.",
  "question": "Sua nova pergunta no final em Inglês Britânico para manter a conversa a fluir.",
  "phoneticTip": "Uma dica super útil sobre vocabulário ou pronúncia em Inglês Britânico (ex: diferença entre elevador 'lift', apartamento 'flat', batatas 'chips').",
  "performanceScore": "Nota numérica de 1 a 10 para a qualidade da resposta do utilizador."
}
`;

          const payload = {
            contents: historyContext,
            systemInstruction: {
              parts: [{ text: systemPrompt }]
            },
            generationConfig: {
              responseMimeType: 'application/json',
              responseSchema: {
                type: 'OBJECT',
                properties: {
                  correction: { type: 'STRING' },
                  hasErrors: { type: 'BOOLEAN' },
                  improvedSentence: { type: 'STRING' },
                  reply: { type: 'STRING' },
                  question: { type: 'STRING' },
                  phoneticTip: { type: 'STRING' },
                  performanceScore: { type: 'INTEGER' }
                },
                required: ['correction', 'hasErrors', 'improvedSentence', 'reply', 'question', 'phoneticTip', 'performanceScore']
              }
            }
          };

          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error(`Gemini API Error: ${response.status}`);
          }

          const result = await response.json();
          const rawJsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;

          if (!rawJsonText) {
            throw new Error('Empty or invalid response from Gemini API.');
          }

          const parsedData = JSON.parse(rawJsonText);

          const tutorMessage = {
            id: (Date.now() + 1).toString(),
            sender: 'tutor',
            content: parsedData,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };

          setMessages((prev) => [...prev, tutorMessage]);

          if (!parsedData.hasErrors || parsedData.performanceScore >= 7) {
            setSuccessfulTurns((prevTurns) => {
              const nextTurns = prevTurns + 1;
              if (nextTurns >= 3 && difficultyLevel < 5) {
                setDifficultyLevel((prevLvl) => prevLvl + 1);
                setLevelUpNotification(true);
                setTimeout(() => setLevelUpNotification(false), 5000);
                return 0;
              }
              return nextTurns;
            });
          } else {
            setSuccessfulTurns(0);
          }

          if (autoPlayAudio) {
            speakText(`${parsedData.reply} ${parsedData.question}`, tutorMessage.id);
          }

        } catch (error) {
          console.error('Error generating response:', error);
          const errorMessage = {
            id: (Date.now() + 1).toString(),
            sender: 'tutor',
            content: {
              correction: 'Lamento, ocorreu um erro na ligação com a inteligência artificial.',
              hasErrors: true,
              improvedSentence: '',
              reply: 'I am so sorry, I had a slight hiccup processing that. Could you please say that again?',
              question: 'Shall we continue our conversation?',
              phoneticTip: 'Please check your internet connection or Gemini API settings.',
              performanceScore: 5
            },
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };
          setMessages((prev) => [...prev, errorMessage]);
        } finally {
          setIsLoading(false);
        }
      };

      const translateText = async (messageId, text) => {
        if (translationMap[messageId]) {
          setTranslationMap((prev) => {
            const newMap = { ...prev };
            delete newMap[messageId];
            return newMap;
          });
          return;
        }

        try {
          const payload = {
            contents: [
              {
                parts: [
                  {
                    text: `Translate this British English sentence to European Portuguese in a natural way: "${text}"`
                  }
                ]
              }
            ]
          };

          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          const translation = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Tradução não disponível.';

          setTranslationMap((prev) => ({ ...prev, [messageId]: translation }));
        } catch (e) {
          console.error('Translation error:', e);
        }
      };

      const getResponseHint = async () => {

                  }

              }
            ],
            generationConfig: { responseMimeType: 'application/json' }
          };

          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          const raw = data.candidates?.[0]?.content?.parts?.[0]?.text;

                      className={`p-3.5 rounded-xl border text-left transition flex items-start space-x-3 ${
                        currentTopic.id === topic.id
                          ? 'bg-indigo-950/70 border-indigo-500'
                          : `${currentTheme.innerCard} hover:border-indigo-500/40`
                      }`}
                    >
                      <span className="text-2xl">{topic.icon}</span>
                      <div>
                        <div className="font-bold text-sm sm:text-base">{topic.title}</div>
                        <div className="text-xs text-indigo-400 mb-1">{topic.titlePt}</div>
                        <div className="text-xs opacity-70">{topic.description}</div>
                      </div>
                    </button>
                  ))}
                </div>

                {/* Custom Topic Input */}
                <div className="pt-3 border-t border-slate-700/50 space-y-2">
                  <label className="text-xs font-semibold block opacity-80">Criar Tópico Personalizado:</label>
                  <div className="flex space-x-2">
                    <input
                      type="text"
                      value={customTopic}
                      onChange={(e) => setCustomTopic(e.target.value)}
                      placeholder="Ex: Ordering Fish & Chips, Football, Doctor Visit..."
                      className={`flex-1 ${currentTheme.inputBg} border rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500`}
                    />
                    <button
                      onClick={applyCustomTopic}
                      className={`${currentTheme.accentBtn} text-white px-4 py-2 rounded-xl text-sm font-semibold transition`}
                    >
                      Criar
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* SETTINGS MODAL */}
          {showSettingsModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className={`${currentTheme.modalBg} border rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5`}>
                <div className="flex items-center justify-between border-b border-slate-700/50 pb-3">
                  <h3 className="text-lg font-bold flex items-center space-x-2">
                    <Sliders className="w-5 h-5 text-indigo-400" />
                    <span>Configurações do Tutor</span>
                  </h3>
                  <button
                    onClick={() => setShowSettingsModal(false)}
                    className="opacity-60 hover:opacity-100"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                {/* Theme Selection in Settings */}
                <div className="space-y-2">
                  <label className="text-xs font-semibold block opacity-80">Tema Visual da Aplicação:</label>
                  <select
                    value={currentTheme.id}
                    onChange={(e) => {
                      const t = THEMES.find((th) => th.id === e.target.value);
                      if (t) setCurrentTheme(t);
                    }}
                    className={`w-full ${currentTheme.inputBg} border rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500`}
                  >
                    {THEMES.map((t) => (
                      <option key={t.id} value={t.id}>
                        {t.icon} {t.name}
                      </option>
                    ))}
                  </select>
                </div>

                {/* Nível de Dificuldade Manual Override */}
                <div className="space-y-2">
                  <label className="text-xs font-semibold block opacity-80">Nível de Dificuldade Atual:</label>
                  <select
                    value={difficultyLevel}
                    onChange={(e) => {
                      const newLvl = Number(e.target.value);
                      setDifficultyLevel(newLvl);
                      startNewConversation(currentTopic, newLvl);
                    }}
                    className={`w-full ${currentTheme.inputBg} border rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500`}
                  >
                    {DIFFICULTY_LEVELS.map((d) => (
                      <option key={d.level} value={d.level}>
                        Nível {d.level}: {d.name}
                      </option>
                    ))}
                  </select>
                </div>

                {/* Speech Rate Control */}
                <div className="space-y-2">
                  <div className="flex justify-between text-xs font-semibold opacity-80">
                    <span>Velocidade da Voz Britânica:</span>
                    <span className="text-indigo-400 font-mono">{speechRate}x</span>
                  </div>
                  <input
                    type="range"
                    min="0.7"
                    max="1.2"
                    step="0.05"
                    value={speechRate}
                    onChange={(e) => setSpeechRate(Number(e.target.value))}
                    className="w-full accent-indigo-500"
                  />
                </div>

                {/* Voice Selection */}
                <div className="space-y-2">
                  <label className="text-xs font-semibold block opacity-80">Voz do Sistema (en-GB):</label>
                  <select
                    value={selectedVoice?.name || ''}
                    onChange={(e) => {
                      const v = availableVoices.find((voice) => voice.name === e.target.value);
                      if (v) setSelectedVoice(v);
                    }}
                    className={`w-full ${currentTheme.inputBg} border rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500`}
                  >
                    {availableVoices.map((v) => (
                      <option key={v.name} value={v.name}>
                        {v.name} ({v.lang})
                      </option>
                    ))}
                  </select>
                </div>

                {/* Custom Gemini API Key override */}
                <div className="space-y-2 pt-2 border-t border-slate-700/50">
                  <label className="text-xs font-semibold block opacity-80">
                    Chave da API Gemini (Opcional):
                  </label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    placeholder="Insira a sua API Key do Gemini se necessário"
                    className={`w-full ${currentTheme.inputBg} border rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500`}
                  />
                </div>

                <button
                  onClick={() => setShowSettingsModal(false)}
                  className={`w-full ${currentTheme.accentBtn} text-white font-semibold py-2.5 rounded-xl transition text-sm`}
                >
                  Guardar e Fechar
                </button>
              </div>
            </div>
          )}

          {/* RESPONSE HINT MODAL */}
          {showHelpModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className={`${currentTheme.modalBg} border rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4`}>
                <div className="flex items-center justify-between border-b border-slate-700/50 pb-3">
                  <h3 className="text-lg font-bold text-amber-400 flex items-center space-x-2">
                    <Sparkles className="w-5 h-5" />
                    <span>Sugestões de Resposta</span>
                  </h3>
                  <button
                    onClick={() => setShowHelpModal(false)}
                    className="opacity-60 hover:opacity-100"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <p className="text-xs opacity-80">
                  Se não souberes o que dizer, podes utilizar ou adaptar uma destas frases em Inglês Britânico:
                </p>

                <div className="space-y-2">
                  {Array.isArray(hintMessage) && hintMessage.map((hint, idx) => (
                    <button
                      key={idx}
                      onClick={() => {
                        setInputText(hint);
                        setShowHelpModal(false);
                      }}
                      className={`w-full p-3 ${currentTheme.innerCard} hover:border-amber-500/50 rounded-xl text-left text-xs sm:text-sm transition font-mono`}
                    >
                      "{hint}"
                    </button>
                  ))}
                </div>

                <button
                  onClick={() => setShowHelpModal(false)}
                  className="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 rounded-xl text-sm font-medium transition"
                >
                  Fechar
                </button>
              </div>
            </div>
          )}

          {/* SPEECH NOT SUPPORTED MODAL */}
          {speechErrorModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className={`${currentTheme.modalBg} border rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-3`}>
                <div className="flex items-center space-x-2 text-amber-400 font-bold">
                  <AlertCircle className="w-5 h-5" />
                  <span>Reconhecimento de Voz</span>
                </div>
                <p className="text-xs opacity-80 leading-relaxed">
                  O seu navegador não suporta a API nativa de reconhecimento de voz. Pode digitar normalmente na caixa de texto.
                </p>
                <button
                  onClick={() => setSpeechErrorModal(false)}
                  className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl text-xs font-semibold"
                >
                  Entendido
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
